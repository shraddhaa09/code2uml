services:
  - type: web
    name: code2uml-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMINI_API_KEY
        sync: false
